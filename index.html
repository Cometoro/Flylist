<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d14">
  <meta name="description" content="TJ 일본곡을 번호, 제목, 원제, 아티스트로 찾는 개인 노래방 아카이브">
  <link rel="canonical" href="https://cometoro.github.io/Flylist/">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png?v=20260803">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon-192.png?v=20260803">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png?v=20260803">
  <title>Flylist</title>

  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="Flylist">
  <meta property="og:title" content="Flylist">
  <meta property="og:description" content="TJ 일본곡 검색 아카이브">
  <meta property="og:url" content="https://cometoro.github.io/Flylist/">
  <meta property="og:image" content="https://cometoro.github.io/Flylist/assets/flylist-preview.jpg?v=20260803">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="Flylist 캐릭터와 TJ 일본곡 검색 아카이브 제목">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Flylist">
  <meta name="twitter:description" content="TJ 일본곡 검색 아카이브">
  <meta name="twitter:image" content="https://cometoro.github.io/Flylist/assets/flylist-preview.jpg?v=20260803">
  <meta name="twitter:image:alt" content="Flylist 캐릭터와 TJ 일본곡 검색 아카이브 제목">

  <link rel="stylesheet" href="./styles.css?v=20260803-2">
  <link rel="stylesheet" href="./custom.css?v=20260722-2">
  <script src="./data.js?v=20260803-2" defer></script>
  <script src="./app.js?v=20260803-2" defer></script>
</head>
<body id="top">
  <div id="mainApp">
    <header class="app-header">
      <div class="brand-row">
        <div>
          <div class="badge-row" aria-label="Flylist edition">
            <span class="badge">TJ SONG BOOK</span>
            <span class="badge badge-soft">PERSONAL EDITION</span>
          </div>
          <h1><span>Fly</span><span>list</span></h1>
        </div>
        <div class="credit">1.0ver</div>
      </div>

      <form class="search" role="search">
        <label class="visually-hidden" for="searchInput">곡 검색</label>
        <div class="search-field">
          <input id="searchInput" type="search" autocomplete="off" placeholder="번호, 제목, 원제, 아티스트 검색"
            role="combobox" aria-autocomplete="list" aria-controls="searchSuggestionList" aria-expanded="false">
          <div id="searchSuggestions" class="search-suggestions" hidden>
            <div id="searchSuggestionList" class="search-suggestion-list" role="listbox" aria-label="검색 제안"></div>
            <button id="clearRecentSearches" class="recent-clear" type="button" hidden>최근 검색어 전체 삭제</button>
          </div>
        </div>
        <button id="clearSearch" class="icon-button" type="button" aria-label="검색어 지우기">×</button>
      </form>

      <div id="stats" class="stats" aria-label="곡 수"></div>
      <nav id="categoryTabs" class="tabs" aria-label="카테고리" role="tablist"></nav>
    </header>

    <main id="mainView">
      <div class="toolbar">
        <div id="resultSummary" class="result-summary"></div>
        <div class="toolbar-actions">
          <button class="index-button" type="button" data-open-index aria-label="빠른 이동 열기"><span class="index-button-icon" aria-hidden="true">⚡︎</span><span>빠른 이동</span></button>
          <div id="viewModeControl" class="view-mode-control" role="group" aria-label="보기 방식">
            <button type="button" data-view-mode="card" aria-label="카드형 보기" title="카드형 보기"><span aria-hidden="true">▦</span><span class="view-mode-label">카드</span></button>
            <button type="button" data-view-mode="list" aria-label="목록형 보기" title="목록형 보기"><span aria-hidden="true">☰</span><span class="view-mode-label">목록</span></button>
          </div>
          <label class="select-wrap">
            <span class="visually-hidden">정렬</span>
            <select id="sortSelect"></select>
          </label>
        </div>
      </div>

      <section id="updateSummary" class="update-summary" hidden></section>
      <div class="content-layout">
        <section id="songList" class="song-list" aria-live="polite"></section>
        <aside id="sectionIndex" class="section-index" aria-label="빠른 이동"></aside>
      </div>
      <p id="emptyState" class="empty-state" hidden>검색 결과가 없다요.</p>
    </main>
  </div>

  <section id="favoritesView" class="favorites-view" hidden>
    <header class="favorites-header">
      <div class="favorites-header-inner">
        <button id="favoritesBack" class="back-button" type="button" aria-label="Flylist로 돌아가기">←</button>
        <div>
          <h2>즐겨찾기</h2>
          <p>아티스트와 개별 곡을 한곳에</p>
        </div>
        <span class="favorites-mark" aria-hidden="true">♥</span>
      </div>
    </header>

    <div class="favorites-inner">
      <nav id="favoriteCategoryTabs" class="favorite-tabs" aria-label="즐겨찾기 카테고리" role="tablist"></nav>
      <div class="favorite-toolbar">
        <div id="favoriteResultSummary" class="result-summary"></div>
        <div class="favorite-toolbar-actions">
          <button id="exportFavorites" class="utility-button" type="button" title="즐겨찾기 백업 파일 저장">백업</button>
          <button id="importFavoritesButton" class="utility-button" type="button" title="즐겨찾기 백업 파일 불러오기">복원</button>
          <input id="importFavoritesFile" type="file" accept="application/json,.json" hidden>
          <button class="index-button" type="button" data-open-index aria-label="즐겨찾기 빠른 이동 열기"><span class="index-button-icon" aria-hidden="true">⚡︎</span><span>빠른 이동</span></button>
        </div>
      </div>
      <div class="content-layout">
        <section id="favoriteSongList" class="song-list" aria-live="polite"></section>
        <aside id="favoriteSectionIndex" class="section-index" aria-label="즐겨찾기 빠른 이동"></aside>
      </div>
      <p id="favoriteEmptyState" class="empty-state" hidden>즐겨찾기한 곡이 없다요.</p>
    </div>
  </section>

  <div id="indexDrawer" class="index-drawer" hidden>
    <button class="index-drawer-backdrop" type="button" data-close-index aria-label="목차 닫기"></button>
    <section class="index-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="indexDrawerTitle">
      <div class="index-drawer-head">
        <h2 id="indexDrawerTitle">빠른 이동</h2>
        <button class="drawer-close" type="button" data-close-index aria-label="목차 닫기">×</button>
      </div>
      <label class="index-drawer-filter-wrap">
        <span class="visually-hidden">빠른 이동 검색</span>
        <input id="indexDrawerFilter" class="index-filter" type="search" placeholder="아티스트·작품 검색" autocomplete="off">
      </label>
      <p id="indexDrawerEmpty" class="index-filter-empty" hidden>일치하는 항목이 없습니다.</p>
      <nav id="indexDrawerNav" class="index-drawer-nav" aria-label="빠른 이동 항목"></nav>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <a class="top-link" href="#top" aria-label="맨 위로">↑</a>
  <!-- Keep this date aligned with the GitHub commit date when publishing. -->
  <footer class="site-footer">
    <span>DATA VERIFIED</span>
    <time datetime="2026-08-03">2026.08.03</time>
  </footer>
</body>
</html>
